[package]
name = "pdf-reader"
version = "0.4.0"
edition = "2024"
license = "MIT"

[lib]
name = "pdf_reader"
crate-type = ["cdylib", "rlib"]

[dependencies]
hayro = "0.9.0"
png = "0.18"
unicode-normalization = "0.1"
sha2 = "0.10"
font-kit = "0.14.3"
unicode-bidi = "0.3"

[target.'cfg(windows)'.dependencies]
plamo3-translate-rs = { path = "../plamo" }
memmap2 = "0.9"
windows = { version = "0.62", features = ["Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Security_Cryptography", "Storage_Streams", "Win32_System_WinRT"] }

[target.'cfg(target_os = "macos")'.dependencies]
plamo-metal-q4 = { path = "../../experiments/metal-q4" }
objc2 = "0.6"
objc2-vision = {version="0.3", default-features=false, features=["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes", "block2", "objc2-core-graphics", "objc2-image-io"]}
objc2-foundation = {version="0.3", features=["NSData", "NSDictionary", "NSString", "NSArray", "NSError"]}


[dev-dependencies]
serde_json = "1"
