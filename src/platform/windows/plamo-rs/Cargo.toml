[package]
name = "plamo3-translate-rs"
version = "0.3.0"
edition = "2024"
description = "CPU-only PLaMo 3 Translate 0.8B Q4_K_M inference"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
force-avx2 = [] # developer test: exercise the path without AVX512

[dependencies]
rayon = "1.10"

[profile.release]
lto = "thin"
codegen-units = 1
